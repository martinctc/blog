<!DOCTYPE html>
<html lang="en" xml:lang="en" data-theme="dark">
  <head>
	<script>
	  // Resolve the colour theme before first paint: stored preference wins,
	  // otherwise fall back to the OS-level colour scheme. Dark is the default.
	  (function () {
	    var theme = 'dark';
	    try {
	      var stored = localStorage.getItem('theme');
	      if (stored === 'light' || stored === 'dark') {
	        theme = stored;
	      } else if (window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches) {
	        theme = 'light';
	      }
	    } catch (e) { /* localStorage unavailable - fall back to dark */ }
	    document.documentElement.setAttribute('data-theme', theme);
	  })();
	</script>
	<link href="//maxcdn.bootstrapcdn.com/font-awesome/4.7.0/css/font-awesome.min.css" rel="stylesheet">
    <title>{% if page.title %}{{ page.title }} – {% endif %}{{ site.name }} – {{ site.description }}</title>

    {% include meta.html %}

    <!--[if lt IE 9]>
      <script src="http://html5shiv.googlecode.com/svn/trunk/html5.js"></script>
    <![endif]-->

    <link rel="stylesheet" type="text/css" href="{{ site.baseurl }}/style.css" />
	
    <link rel="alternate" type="application/rss+xml" title="{{ site.name }} - {{ site.description }}" href="{{ site.baseurl }}/feed.xml" />
	
	<!-- Include tags -->
	{% if site.tags != "" %}
		{% include collecttags.html %}
	{% endif %}

    <!-- Created with Jekyll Now - http://github.com/barryclark/jekyll-now -->
  </head>

  <body>
    <div class="wrapper-masthead">
      <div class="container">
        <header class="masthead clearfix">
          <a href="{{ site.baseurl }}/" class="site-avatar"><img src="{{ site.avatar }}" /></a>

          <div class="site-info">
            <h1 class="site-name"><a href="{{ site.baseurl }}/">{{ site.name }}</a></h1>
            <p class="site-description">{{ site.description }}</p>
          </div>

          <button class="theme-toggle" id="theme-toggle" type="button" aria-pressed="false" aria-label="Switch to light mode">
            <i class="fa fa-sun" aria-hidden="true"></i>
          </button>

          <nav>
            <a href="{{ site.baseurl }}/"><i class='fa fa-home'></i> Home</a> 
			<a href="{{ site.url }}/about.html"><i class='fa fa-user'></i> About</a>
			<a href="{{ site.url }}/portfolio.html"><i class='fa fa-file-code-o'></i> Portfolio</a>
          </nav>
        </header>
      </div>
    </div>
	
    <div id="main" role="main" class="container">
      {{ content }}
    </div>

    <div class="wrapper-footer">
      <div class="container">
        <footer class="footer">
          {% include svg-icons.html %}
        </footer>
      </div>
    </div>
	
    {% include analytics.html %}	

    <script>
      (function () {
        var toggle = document.getElementById('theme-toggle');
        if (!toggle) { return; }
        var icon = toggle.querySelector('i');

        function applyTheme(theme) {
          document.documentElement.setAttribute('data-theme', theme);
          var nextTheme = theme === 'light' ? 'dark' : 'light';
          toggle.setAttribute('aria-label', 'Switch to ' + nextTheme + ' mode');
          toggle.setAttribute('aria-pressed', theme === 'light');
          if (icon) { icon.className = 'fa ' + (theme === 'light' ? 'fa-moon' : 'fa-sun'); }
        }

        toggle.addEventListener('click', function () {
          var theme = document.documentElement.getAttribute('data-theme') === 'light' ? 'dark' : 'light';
          try { localStorage.setItem('theme', theme); } catch (e) { /* ignore */ }
          applyTheme(theme);
        });

        applyTheme(document.documentElement.getAttribute('data-theme') || 'dark');
      })();
    </script>
  </body>
</html>
